<body>

<label class="flex items-center gap-2 border p-3 rounded cursor-pointer hover:bg-blue-50"><input type="radio" name="method" value="Airtel 0747550170"><span class="text-sm">Airtel Money - 0747550170</span></label>
</div>
</div>

<div class="bg-yellow-50 border border-yellow-300 p-3 rounded text-center"><p class="text-xs font-bold">SEND TO MTN NUMBER:</p><a href="tel:*165*1*0761291972%23" class="text-2xl font-black text-blue-800 underline">0761291972</a><p class="text-[10px] text-gray-500 mt-1">After paying, paste TxID below</p></div>

<div><label class="text-xs text-gray-500">MTN Transaction ID:</label><input id="momoTx" placeholder="Paste TxID here after paying 0761291972" class="w-full mt-1 p-2.5 border rounded text-sm border-yellow-400"></div>

</div>
</div>

<div class="bg-white rounded shadow p-6 mt-6">

<div class="overflow-auto mt-3"><table class="w-full text-xs"><thead class="text-gray-400 text-[10px]"><tr><th class="text-left p-2">Date</th><th class="text-left p-2">Plan</th><th class="text-left p-2">Amount</th><th class="text-left p-2">Method</th><th class="text-left p-2">TxID</th><th class="text-left p-2">Status</th></tr></thead><tbody id="myDepositsTable"></tbody></table></div>
</div>

<div class="bg-white rounded shadow p-6 mt-6">
<div class="flex justify-between items-center border-b pb-3"><h3 class="font-bold text-[#0f1f3c]">Withdraw Funds - MTN 0761291972</h3><button onclick="loadMyWithdrawals()" class="text-[10px] border px-2 py-1 rounded">Refresh</button></div>
<div class="mt-3 grid md:grid-cols-3 gap-2"><input id="withdrawAmount" type="number" placeholder="Amount $" class="p-2.5 border rounded text-sm"><input id="withdrawMomo" type="tel" placeholder="Your MTN 07..." class="p-2.5 border rounded text-sm"><button onclick="requestWithdraw()" class="bg-green-600 text-white rounded font-bold text-sm">Request Withdrawal</button></div>

<div class="overflow-auto mt-4"><table class="w-full text-xs"><thead class="text-gray-400 text-[10px]"><tr><th class="text-left p-2">Date</th><th class="text-left p-2">Amount</th><th class="text-left p-2">MTN</th><th class="text-left p-2">Status</th></tr></thead><tbody id="myWithdrawalsTable"></tbody></table></div>
</div>

<div class="flex justify-center gap-4 mt-6"><button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="px-6 py-2 border border-blue-800 text-blue-800 rounded text-sm font-bold">Deposit</button><button onclick="document.getElementById('withdrawAmount').scrollIntoView({behavior:'smooth'})" class="px-6 py-2 border border-blue-800 text-blue-800 rounded text-sm font-bold">Withdraw</button></div>
</div>

<section id="adminPanel" class="hidden max-w-6xl mx-auto p-4 mt-6 border-t-2 border-yellow-400"><h2 class="font-black text-lg">ADMIN - All Deposits to 0761291972</h2><div class="grid md:grid-cols-3 gap-4 mt-4"><div class="bg-white p-4 rounded shadow"><h3 class="font-bold text-xs mb-2">Users <button id="refreshUsers" class="ml-2 border px-2 py-0.5 rounded text-[10px]">Refresh</button></h3><table class="w-full text-[11px]"><tbody id="usersTable"></tbody></table></div><div class="bg-white p-4 rounded shadow"><h3 class="font-bold text-xs mb-2">Deposits 0761291972 <button id="refreshDeposits" class="ml-2 bg-yellow-400 px-2 py-0.5 rounded text-[10px]">Refresh</button></h3><table class="w-full text-[10px]"><tbody id="depositsTable"></tbody></table></div><div class="bg-white p-4 rounded shadow"><h3 class="font-bold text-xs mb-2">Withdrawals <button onclick="loadWithdrawals()" class="ml-2 border px-2 py-0.5 rounded text-[10px]">Refresh</button></h3><table class="w-full text-[10px]"><tbody id="withdrawalsTable"></tbody></table></div></div></section>

<div id="authModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><div class="bg-white p-6 rounded shadow w-full max-w-sm"><h2 id="modalTitle" class="font-bold text-lg mb-4">Login</h2><input id="emailInput" type="email" placeholder="Email" class="w-full p-2.5 border rounded mb-2 text-sm"><input id="passwordInput" type="password" placeholder="Password" class="w-full p-2.5 border rounded mb-3 text-sm"><p id="authError" class="text-red-500 text-xs mb-2 hidden"></p><button id="authSubmit" class="w-full bg-[#0f1f3c] text-white py-2.5 rounded font-bold text-sm">Continue</button><button id="closeModal" class="w-full py-2 mt-2 text-gray-500 text-xs">Cancel</button></div></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";
import { getFirestore, doc, setDoc, collection, getDocs, addDoc, serverTimestamp, query, where } from "firebase/firestore";
const ADMIN_EMAIL = "tamalechrisbrown@gmail.com";
const firebaseConfig = {apiKey:"AIzaSyBdOK7pAsuyUTL9PTVJdQZiuBGhmfSG7Rs",authDomain:"bluewave-cryptol.firebaseapp.com",projectId:"bluewave-cryptol",storageBucket:"bluewave-cryptol.firebasestorage.app",messagingSenderId:"535546450808",appId:"1:535546450808:web:e02c244d9772fe4fb96e8d"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
let mode="login";let currentUser=null;
const planImages={"Trial $5 - iPhone Accessories - 18.5k UGX":"https://images.unsplash.com/photo-1605236453806-6ff36851218e?w=200","Student $10 - Samsung S24 - 37k UGX":"https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?w=200","Starter $20 - Smartphones - 74k UGX":"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=200","Basic $50 - Computers - 185k UGX":"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=200","Silver $100 - iPhone 15 Pro Max - 370k UGX":"https://images.unsplash.com/photo-1592899677977-9bb10ba128a5?w=200","Gold $200 - MacBook Pro M3 - 740k UGX":"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=200","Premium $300 - Car Business - 1.1M UGX":"https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=200","Platinum $500 - Toyota Camry 2023 - 1.85M UGX":"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=200","Elite $750 - Luxury House - 2.7M UGX":"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=200","Diamond $1000 - House+Car Empire - 3.7M UGX - VIP MAX":"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=200"};
const modal=document.getElementById('authModal');const modalTitle=document.getElementById('modalTitle');const authSubmit=document.getElementById('authSubmit');const emailInput=document.getElementById('emailInput');const passwordInput=document.getElementById('passwordInput');const authError=document.getElementById('authError');
function openModal(m){mode=m;modalTitle.textContent=m==="login"?"Login":"Sign Up";authSubmit.textContent=m==="login"?"Login":"Sign Up";modal.classList.remove('hidden');authError.classList.add('hidden');}
document.getElementById('loginBtn').onclick=()=>openModal('login');document.getElementById('signupBtn').onclick=()=>openModal('signup');document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');
document.getElementById('planSelect').onchange=(e)=>{const v=e.target.value;if(v && planImages[v]){document.getElementById('previewImg').src=planImages[v];document.getElementById('previewText').textContent=v;document.getElementById('planPreview').classList.remove('hidden');}else{document.getElementById('planPreview').classList.add('hidden');}};
authSubmit.onclick=async()=>{const em=emailInput.value.trim();const ps=passwordInput.value.trim();if(!em||ps.length<6){authError.textContent="Email + 6 chars";authError.classList.remove('hidden');return;}authSubmit.textContent="Wait...";authSubmit.disabled=true;try{if(mode==="signup"){const c=await createUserWithEmailAndPassword(auth,em,ps);await setDoc(doc(db,"users",c.user.uid),{email:em,createdAt:serverTimestamp(),balance:0});}else{await signInWithEmailAndPassword(auth,em,ps);}modal.classList.add('hidden');emailInput.value="";passwordInput.value="";}catch(er){authError.textContent=er.message;authError.classList.remove('hidden');}authSubmit.textContent=mode==="login"?"Login":"Sign Up";authSubmit.disabled=false;};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,(user)=>{
currentUser=user;const lb=document.getElementById('loginBtn');const sb=document.getElementById('signupBtn');const lob=document.getElementById('logoutBtn');const ab=document.getElementById('adminBtn');const uw=document.getElementById('userWelcome');
if(user){lb.classList.add('hidden');sb.classList.add('hidden');lob.classList.remove('hidden');if(user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){ab.classList.remove('hidden');uw.innerHTML=`<b class='text-yellow-600'>ADMIN: ${user.email} - You see ALL deposits</b>`;}else{ab.classList.add('hidden');uw.innerHTML=`<span class='text-green-600'>✓ Customer: ${user.email} - Your history below</span>`;}uw.classList.remove('hidden');loadMyDeposits();loadMyWithdrawals();}else{lb.classList.remove('hidden');sb.classList.remove('hidden');lob.classList.add('hidden');ab.classList.add('hidden');document.getElementById('adminPanel').classList.add('hidden');uw.classList.add('hidden');}
});
window.makeDeposit=async()=>{
if(!currentUser){openModal('login');return;}
const plan=document.getElementById('planSelect').value;const amount=document.getElementById('depositAmount').value.trim();const method=document.querySelector('input[name="method"]:checked').value;const tx=document.getElementById('momoTx').value.trim();
if(!plan){alert("Select Plan");return;}if(!amount){alert("Enter Amount");return;}if(!tx){alert("Paste TxID after paying 0761291972");return;}
const btn=document.getElementById('depositBtn');btn.textContent="Saving...";btn.disabled=true;
try{await addDoc(collection(db,"deposits"),{userEmail:currentUser.email,userId:currentUser.uid,plan,amount,method,txId:tx,status:"Pending - Check 0761291972",createdAt:serverTimestamp()});document.getElementById('depositMsg').textContent=`✓ Deposit $${amount} for ${plan} TxID:${tx} saved!`;document.getElementById('depositMsg').classList.remove('hidden');loadMyDeposits();setTimeout(()=>{document.getElementById('depositMsg').classList.add('hidden');btn.textContent="Make Deposit";btn.disabled=false;},4000);}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Make Deposit";}
};
async function loadMyDeposits(){if(!currentUser)return;const tb=document.getElementById('myDepositsTable');tb.innerHTML="<tr><td class='p-2 text-gray-400'>Loading...</td></tr>";try{const q=query(collection(db,"deposits"),where("userId","==",currentUser.uid));const snap=await getDocs(q);let h="";snap.forEach(d=>{const data=d.data();const date=data.createdAt?new Date(data.createdAt.seconds*1000).toLocaleDateString():"Now";h+=`<tr class='border-t'><td class='p-2'>${date}</td><td class='p-2 text-blue-800 font-bold'>${data.plan.substring(0,18)}</td><td class='p-2'>$${data.amount}</td><td class='p-2'>${data.method.substring(0,12)}</td><td class='p-2 font-mono'>${data.txId.substring(0,8)}</td><td class='p-2 text-yellow-600'>${data.status}</td></tr>`;});tb.innerHTML=h||"<tr><td class='p-2 text-gray-400'>No deposits yet</td></tr>";}catch(e){tb.innerHTML=`<tr><td class='p-2 text-red-400'>${e.message}</td></tr>`;}}
async function loadMyWithdrawals(){if(!currentUser)return;const tb=document.getElementById('myWithdrawalsTable');tb.innerHTML="<tr><td class='p-2 text-gray-400'>Loading...</td></tr>";try{const q=query(collection(db,"withdrawals"),where("userId","==",currentUser.uid));const snap=await getDocs(q);let h="";snap.forEach(d=>{const data=d.data();const date=data.createdAt?new Date(data.createdAt.seconds*1000).toLocaleDateString():"Now";h+=`<tr class='border-t'><td class='p-2'>${date}</td><td class='p-2 text-green-600'>$${data.amount}</td><td class='p-2'>${data.momoNumber}</td><td class='p-2 text-yellow-600'>${data.status}</td></tr>`;});tb.innerHTML=h||"<tr><td class='p-2 text-gray-400'>No withdrawals</td></tr>";}catch(e){tb.innerHTML=`<tr><td>${e.message}</td></tr>`;}}
window.requestWithdraw=async()=>{if(!currentUser){openModal('login');return;}const amt=document.getElementById('withdrawAmount').value.trim();const momo=document.getElementById('withdrawMomo').value.trim();if(!amt||!momo){alert("Amount + MTN");return;}try{await addDoc(collection(db,"withdrawals"),{userEmail:currentUser.email,userId:currentUser.uid,amount:amt,momoNumber:momo,plan:"Withdraw page",status:"Pending - Admin via 0761291972",createdAt:serverTimestamp()});document.getElementById('withdrawMsg').textContent=`✓ Withdraw $${amt} to ${momo} saved!`;document.getElementById('withdrawMsg').classList.remove('hidden');loadMyWithdrawals();setTimeout(()=>{document.getElementById('withdrawMsg').classList.add('hidden');},4000);}catch(e){alert(e.message);}};
document.getElementById('adminBtn').onclick=()=>{const p=document.getElementById('adminPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden')){loadUsers();loadDeposits();loadWithdrawals();}};
async function loadUsers(){const tb=document.getElementById('usersTable');tb.innerHTML="<tr><td>Loading...</td></tr>";try{const snap=await getDocs(collection(db,"users"));let h="";snap.forEach(d=>{h+=`<tr class='border-t'><td class='p-1'>${d.data().email}</td></tr>`;});tb.innerHTML=h;}catch(e){tb.innerHTML=`<tr><td>${e.message}</td></tr>`;}}
async function loadDeposits(){const tb=document.getElementById('depositsTable');tb.innerHTML="<tr><td>Loading...</td></tr>";try{const snap=await getDocs(collection(db,"deposits"));let h="";snap.forEach(d=>{const data=d.data();h+=`<tr class='border-t'><td class='p-1'>${data.userEmail.split('@')[0]}</td><td class='p-1'>${data.plan.substring(0,10)}</td><td class='p-1'>$${data.amount}</td><td class='p-1'>${data.txId.substring(0,6)}</td></tr>`;});tb.innerHTML=h;}catch(e){tb.innerHTML=`<tr><td>${e.message}</td></tr>`;}}
async function loadWithdrawals(){const tb=document.getElementById('withdrawalsTable');tb.innerHTML="<tr><td>Loading...</td></tr>";try{const snap=await getDocs(collection(db,"withdrawals"));let h="";snap.forEach(d=>{const data=d.data();h+=`<tr class='border-t'><td class='p-1'>${data.userEmail.split('@')[0]}</td><td class='p-1'>$${data.amount}</td><td class='p-1'>${data.momoNumber}</td></tr>`;});tb.innerHTML=h;}catch(e){tb.innerHTML=`<tr><td>${e.message}</td></tr>`;}}
document.getElementById('refreshUsers').onclick=loadUsers;document.getElementById('refreshDeposits').onclick=loadDeposits;window.loadWithdrawals=loadWithdrawals;window.loadMyDeposits=loadMyDeposits;window.loadMyWithdrawals=loadMyWithdrawals;
</script>
</body>
  </html>
